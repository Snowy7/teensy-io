[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teensy-io"
version = "0.1.0"
description = "Generic Teensy IO client library"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyserial>=3.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["teensy_io*"]
