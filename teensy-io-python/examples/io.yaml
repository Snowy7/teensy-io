port: /dev/ttyACM0
baudrate: 1000000
heartbeat_hz: 20
watchdog_timeout_ms: 300

pins:
  status_led:
    type: digital_output
    physical_pin: 13
    initial: false

  motor_pwm:
    type: pwm
    physical_pin: 3
    frequency: 20000
    initial_duty: 0.0

  battery_voltage:
    type: analog
    physical_pin: 14
    samples: 8

inputs:
  wheel_pulse:
    physical_pin: 7
    pull: up
    debounce_us: 50

counters:
  wheel_ticks:
    input: wheel_pulse
    edge: rising

encoders:
  steering_encoder:
    pin_a: 5
    pin_b: 6
    mode: x4

i2c_buses:
  main_i2c:
    bus: 0
    frequency: 400000

dacs:
  analog_output:
    bus: main_i2c
    address: 96
    channels: 1
    resolution_bits: 12
